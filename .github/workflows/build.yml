name: Build Benchmark

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Build benchmark
        run: |
          make clean
          make benchmark

      - name: Build standalone test
        run: |
          make standalone

      - name: Upload benchmark artifact
        uses: actions/upload-artifact@v4
        with:
          name: ioperf_benchmark-${{ github.ref_name }}
          path: ioperf_benchmark
          retention-days: 30

      - name: Upload standalone test artifact
        uses: actions/upload-artifact@v4
        with:
          name: test_bdev_standalone-${{ github.ref_name }}
          path: test_bdev_standalone
          retention-days: 30

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: ncipollo/release-action@v1
        with:
          artifacts: "ioperf_benchmark,test_bdev_standalone"
          artifactErrorsFailBuild: true
          generateReleaseNotes: true
